name: PayGate Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            examples/express-paid-api/package-lock.json

      - name: Scan tracked files for committed secrets
        run: npm run scan:secrets

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            examples/express-paid-api/package-lock.json

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit frontend build dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix frontend audit

  beta-smoke:
    name: Beta smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            examples/express-paid-api/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm ci

      - name: Install local adapter and example dependencies
        run: |
          npm --prefix backend ci
          npm --prefix examples/express-paid-api ci

      - name: Verify dependency compatibility and audit failure handling
        run: npm run test:dependencies

      - name: Run beta smoke, build, and contract tests
        run: npm run test:beta

      - name: Install browser for routing regression
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Verify SPA routes and navigation
        run: npm run test:browser
